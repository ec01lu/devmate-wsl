name: Secret scan

# Scans the full reachable history of every pushed commit and pull request
# head with a pinned, checksum-verified gitleaks release. The default ruleset
# applies; .gitleaks.toml owns the narrow allowances for fake test fixtures.
# Findings are redacted in the log so a real leak is not republished there.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          set -eu
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --max-filesize 30000000 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            -o "$dir/$asset"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan history
        run: gitleaks git . --config .gitleaks.toml --log-opts=HEAD --redact --no-banner --verbose
